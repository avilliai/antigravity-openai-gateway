# Antigravity OpenAI Gateway Configuration
host: "127.0.0.1"
port: 8045

# Optional: Require an API key (Bearer token) from clients. If empty, allows any or no key.
api_key: ""

# Path to official agy CLI binary. Auto-detected if empty or left default.
cli_command: "agy"

# Outbound HTTP/SOCKS5 proxy URL for agy process (e.g. Clash Verge, v2rayN)
# If empty, automatically inherits system environment variables (HTTP_PROXY / HTTPS_PROXY).
proxy: ""

# Default Antigravity model if unspecified by client
default_model: "gemini-3.8-flash-low"

# Request timeout in seconds
timeout: 120.0

# Maximum concurrent CLI subprocesses (1-2 recommended to prevent CLI DB lock contention)
max_concurrency: 2

# Model aliases mapping standard OpenAI/Claude names to Antigravity CLI model flags
model_aliases:
  gpt-4: "claude-sonnet-4-6"
  gpt-4o: "gemini-3.8-flash-medium"
  gpt-4o-mini: "gemini-3.8-flash-low"
  gpt-3.5-turbo: "gemini-3.8-flash-low"
  claude-3-5-sonnet: "claude-sonnet-4-6"
  claude-3-opus: "claude-opus-4-6-thinking"
  gemini-pro: "gemini-3.8-flash-medium"
  gemini-flash: "gemini-3.8-flash-low"
  gemini-2.5-pro: "gemini-3.8-flash-medium"
  gemini-3.8-flash-low: "gemini-3.8-flash-low"
  gemini-3.8-flash-medium: "gemini-3.8-flash-medium"
  gemini-3.8-flash-high: "gemini-3.8-flash-high"
  claude-sonnet-4-6: "claude-sonnet-4-6"
  claude-opus-4-6-thinking: "claude-opus-4-6-thinking"
  gpt-oss-120b-medium: "gpt-oss-120b-medium"
